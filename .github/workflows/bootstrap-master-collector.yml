name: Bootstrap MASTER Collector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract verified MASTER package
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("MASTER_Collector_vNext_GITHUB_MOBILE.zip")

          if not archive.is_file():
              raise SystemExit(f"Missing deployment archive: {archive}")

          expected = {
              "master_data/__init__.py",
              "master_data/collector_scope.py",
              "master_data/collector_runtime.py",
              "scripts/run_collector_vnext.py",
              "tests/test_collector_vnext.py",
              ".github/workflows/master-collector-vnext.yml",
          }

          with ZipFile(archive) as z:
              actual = set(z.namelist())

              if actual != expected:
                  raise SystemExit(
                      "Unexpected deployment package contents: "
                      + repr(sorted(actual))
                  )

              z.extractall(".")

          print("MASTER Collector package extracted successfully.")
          PY

      - name: Validate collector
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check -q pytest

          python -m py_compile \
            master_data/__init__.py \
            master_data/collector_scope.py \
            master_data/collector_runtime.py \
            scripts/run_collector_vnext.py \
            tests/test_collector_vnext.py

          python -m pytest -q tests/test_collector_vnext.py

      - name: Commit MASTER Collector
        shell: bash
        run: |
          set -euo pipefail

          rm -f MASTER_Collector_vNext_GITHUB_MOBILE.zip
          rm -f .github/workflows/bootstrap-master-collector.yml

          rm -f MASTER_Collector_vNext_GITHUB_MOBILE.zip
rm -f .github/workflows/master-collector-vnext.yml

find . -type d -name "__pycache__" -prune -exec rm -rf {} +
find . -type f -name "*.pyc" -delete

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Deploy MASTER Collector vNext runtime"
          git push origin HEAD:main
