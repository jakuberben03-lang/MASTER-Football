name: Bootstrap MASTER API Football Guard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and extract API-Football guard patch
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          archive = Path("MASTER_API_FOOTBALL_GUARD_PATCH.zip")

          expected_sha256 = (
              "43dbbb27c11dccbf70988dd2ec5d2d995e1afe78efdb5281fe17b09d3a4d99c3"
          )

          expected_files = {
              "master_data/api_football_guard.py",
              "scripts/run_collector_vnext.py",
              "tests/test_api_football_guard.py",
          }

          if not archive.is_file():
              raise SystemExit(
                  f"Missing patch archive: {archive}"
              )

          actual_sha256 = hashlib.sha256(
              archive.read_bytes()
          ).hexdigest()

          print("expected_sha256 =", expected_sha256)
          print("actual_sha256   =", actual_sha256)

          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  "PATCH SHA256 MISMATCH - refusing deployment"
              )

          with ZipFile(archive) as z:
              actual_files = set(z.namelist())

              if actual_files != expected_files:
                  raise SystemExit(
                      "Unexpected patch contents: "
                      + repr(sorted(actual_files))
                  )

              z.extractall(".")

          print("API-Football guard patch verified and extracted.")
          PY

      - name: Validate patched collector
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -q pytest

          python -m py_compile \
            master_data/__init__.py \
            master_data/collector_scope.py \
            master_data/collector_runtime.py \
            master_data/api_football_guard.py \
            scripts/run_collector_vnext.py \
            tests/test_collector_vnext.py \
            tests/test_api_football_guard.py

          python -m pytest -q \
            tests/test_collector_vnext.py \
            tests/test_api_football_guard.py

      - name: Commit API-Football guard patch
        shell: bash
        run: |
          set -euo pipefail

          rm -f MASTER_API_FOOTBALL_GUARD_PATCH.zip

          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            MASTER_API_FOOTBALL_GUARD_PATCH.zip \
            master_data/api_football_guard.py \
            scripts/run_collector_vnext.py \
            tests/test_api_football_guard.py

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          echo "Files to deploy:"
          git diff --cached --name-status

          git commit \
            -m "Apply API-Football guard patch"

          git push origin HEAD:main
